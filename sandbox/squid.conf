# Egress proxy for the blind routing agent: the open internet minus GitHub (the user's routed
# boards are public there) and pcbjam (the user's hosted projects). GitHub mirrors/caches that
# would serve the same files are blocked too.
http_port 3128
acl blocked dstdom_regex -i (^|\.)(github\.com|github\.io|githubusercontent\.com|githubassets\.com|githubcopilot\.com|ghcr\.io|githubapp\.com)$
acl blocked dstdom_regex -i pcbjam
# Published copies of the reference boards (Arduino's own design files, Kitspace project mirrors).
acl blocked dstdom_regex -i (^|\.)(arduino\.cc|kitspace\.org)$
acl blocked dstdom_regex -i (^|\.)(archive\.org|sourcegraph\.com|gitee\.com|gitclone\.com|kgithub\.com|ghproxy\.com|jsdelivr\.net|statically\.io|githack\.com|gitcdn\.link)$
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
# 11/20: Astra fetched the Glasgow repo as a Go module zip (proxy.golang.org -> storage.googleapis.com). Go module
# proxies, other forges and the reference boards' own project sites are blocked too.
acl blocked dstdom_regex -i (^|\.)(proxy\.golang\.org|sum\.golang\.org|goproxy\.io|goproxy\.cn|pkg\.go\.dev|deps\.dev|storage\.googleapis\.com)$
acl blocked dstdom_regex -i (^|\.)(gitlab\.com|codeberg\.org|bitbucket\.org|sr\.ht|sourceforge\.net|softwareheritage\.org|launchpad\.net|gitea\.com|notabug\.org)$
acl blocked dstdom_regex -i (^|\.)(glasgow-embedded\.org|1bitsquared\.com|gregdavill\.com|orangecrab-fpga\.github\.io|antmicro\.com|crowdsupply\.com|oshwlab\.com|oshwhub\.com|easyeda\.com|hackaday\.io)$
http_access deny blocked
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# 11/20: allowlist. Astra got the Glasgow repo through ghproxy.net after the Go proxy was blocked, so a denylist
# can't keep up. Allowed: the model APIs, package registries and JDK downloads (tool installs), and datasheet / fab
# sites. Everything else is denied. (jitpack.io builds GitHub repos on demand: not allowed.)
acl allowed dstdom_regex -i (^|\.)(anthropic\.com|claude\.ai|datadoghq\.com|chatgpt\.com|openai\.com|oaiusercontent\.com)$
acl allowed dstdom_regex -i (^|\.)(pypi\.org|pythonhosted\.org|npmjs\.org|deb\.debian\.org|security\.debian\.org|repo\.maven\.apache\.org|repo1\.maven\.org|conda\.anaconda\.org)$
acl allowed dstdom_regex -i (^|\.)(corretto\.aws|adoptium\.net|azul\.com)$
acl allowed dstdom_regex -i (^|\.)(jlcpcb\.com|lcsc\.com|datasheets\.raspberrypi\.com|pip\.raspberrypi\.com|pip-assets\.raspberrypi\.com|ti\.com|analog\.com|st\.com|microchip\.com|nxp\.com|onsemi\.com|infineon\.com|latticesemi\.com|diodes\.com|vishay\.com|murata\.com|we-online\.com|molex\.com|te\.com|mouser\.com|digikey\.com|alldatasheet\.com|ftdichip\.com|silabs\.com|renesas\.com|ww1\.microchip\.com|kicad\.org)$
http_access allow allowed
http_access deny all
# Log every host the agent reached, for the report.
logformat hosts %ts %>a %Ss/%>Hs %rm %ru
access_log stdio:/var/log/squid/access.log hosts
cache deny all
